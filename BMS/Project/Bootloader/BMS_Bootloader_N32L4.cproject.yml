project:
  output:
    base-name: bms_$OutputName$
    type:
      - bin
  packs:
    - pack: NSING::N32L40x_DFP@1.0.1
  setups:
    - setup: Options for BMSVESCCodeN32L4
      processor:
        fpu: sp
      add-path:
        - ../../Library/Nationstech.N32L40x_Library.1.2.2/firmware/CMSIS/core
        - ../../Library/Nationstech.N32L40x_Library.1.2.2/firmware/CMSIS/device
        - ../../Library/Nationstech.N32L40x_Library.1.2.2/firmware/n32l40x_std_periph_driver/inc
        - ../../Source/App
        - ../../Source/Config
        - ../../Source/Drive
        - ../../Source/User
        - ../../Source/VESC
      define:
        - N32L40X
        - USE_STDPERIPH_DRIVER
        - __MICROLIB
      define-asm:
        - __MICROLIB
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -gdwarf-4
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -Wno-packed
            - -Wno-missing-variable-declarations
            - -Wno-missing-prototypes
            - -Wno-missing-noreturn
            - -Wno-sign-conversion
            - -Wno-nonportable-include-path
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
          CPP:
            - -xc++
            - -std=c++03
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --library_type=microlib
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: Objects/BMS_Bootloader_N32L4.sct
  groups:
    - group: User
      files:
        - file: ../../Source/User/bootloader.c
        - file: ../../Library/Nationstech.N32L40x_Library.1.2.2/firmware/CMSIS/device/system_n32l40x.c
    - group: Startup
      files:
        - file: ../../Library/Nationstech.N32L40x_Library.1.2.2/firmware/CMSIS/device/startup/startup_n32l40x.s
          misc:
            - ASM:
                - -masm=auto
    - group: Config
      files:
        - file: ../../Source/Config/confparser.c
        - file: ../../Source/Config/conf_general.c
    - group: App
      files:
        - file: ../../Source/App/flag.c
    - group: Drive
      files:
        - file: ../../Source/Drive/led.c
        - file: ../../Source/Drive/flash.c
    - group: VESC
      files:
        - file: ../../Source/VESC/buffer.c
        - file: ../../Source/VESC/crc.c
    - group: Library
      files:
        - file: ../../Library/Nationstech.N32L40x_Library.1.2.2/firmware/n32l40x_std_periph_driver/src/n32l40x_gpio.c
        - file: ../../Library/Nationstech.N32L40x_Library.1.2.2/firmware/n32l40x_std_periph_driver/src/n32l40x_rcc.c
        - file: ../../Library/Nationstech.N32L40x_Library.1.2.2/firmware/n32l40x_std_periph_driver/src/n32l40x_flash.c
